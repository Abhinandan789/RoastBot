name: Reject PRs to main

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  reject:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce develop as base branch
        run: |
          echo "Feature branches must target 'develop', not 'main'."
          echo "::warning::Branch policy warning only; this workflow no longer hard-fails pull requests."
